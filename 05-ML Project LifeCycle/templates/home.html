<html>
<body>
    <div class="login">
        <h1>FWI Prediction</h1>
    </div>
    <form action="{{ url_for('predict_datapoint') }}" method="post">
        <!-- <label for="input_data">Enter input data:</label> -->

        <input type="text" name="Temperature" placeholder="Enter Temperature" required="required" />
        <input type="text" name="RH" placeholder="Enter Humidity" required="required" />
        <input type="text" name="Ws" placeholder="Enter Wind Speed" required="required" />
        <input type="text" name="Rain" placeholder="Enter Rainfall" required="required" />
        <input type="text" name="FFMC" placeholder="Enter FFMC" required="required" />
        <input type="text" name="DMC" placeholder="Enter DMC" required="required" />
        <input type="text" name="ISI" placeholder="Enter ISI" required="required" />
        <input type="text" name="Classes" placeholder="Enter Classes" required="required" />
        <input type="text" name="Region" placeholder="Enter Region" required="required" /> 


        <button type="submit" class="btn btn-primary btn-block btn-large">Predict</button>
    </form>

    <h2>Prediction Result: {{results}}</h2>
</body>
</html>
